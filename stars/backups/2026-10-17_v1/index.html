<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Stars</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stars"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

    const MODEL = "stars3.glb";
    const ENV = "studio.hdr";

    // Per star: floating rhythm (seconds per cycle), height, small tilt, and phase so they never move in sync.
    const FLOAT = {
      // delay: when the star starts its entrance on page load (top first, bottom last)
      Star_Small:  { period: 3.9, lift: 0.035, tilt: 0.09, phase: 3.7, delay: 0.0 },
      Star_Medium: { period: 4.8, lift: 0.040, tilt: 0.07, phase: 1.9, delay: 0.15 },
      Star_Large:  { period: 6.0, lift: 0.045, tilt: 0.05, phase: 0.0, delay: 0.3 },
    };
    const SPIN_SECONDS = 1.4;        // hover: one 360 turn
    const RETURN_SECONDS = 1.0;      // after letting go, ease back to the original pose
    const DRAG_SPEED = 0.012;        // radians per pixel
    const INTRO_SECONDS = 0.9;       // page load: each star rises in and fades up
    const INTRO_DROP = 0.8;          // how far below its spot a star starts
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const canvas = document.getElementById("stars");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 0.7;   // overall brightness of the lighting (1 = original)
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 7);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envReady = new RGBELoader().loadAsync(ENV).then((hdr) => {
      scene.environment = pmrem.fromEquirectangular(hdr).texture;
      hdr.dispose();
    });
    let introStart = null;   // set once model and lighting are both loaded, so nothing pops in unlit

    const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/");
    const loader = new GLTFLoader().setDRACOLoader(draco);

    const stars = [];
    loader.load(MODEL, (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // centre the whole group in view
      const box = new THREE.Box3().setFromObject(model);
      model.position.sub(box.getCenter(new THREE.Vector3()));
      model.updateMatrixWorld(true);

      // give every star its own pivot at its own centre, so it floats and turns around its own anchor point
      for (const name of Object.keys(FLOAT)) {
        const mesh = model.getObjectByName(name);
        if (!mesh) continue;
        const centre = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
        const pivot = new THREE.Group();
        pivot.position.copy(centre);
        scene.add(pivot);
        pivot.attach(mesh);
        mesh.material = mesh.material.clone();   // own material per star, so each can fade on its own
        mesh.material.transparent = true;
        mesh.material.opacity = 0;
        stars.push({
          pivot, mesh, base: centre.clone(), float: FLOAT[name],
          spin: null, spinAngle: 0,          // hover 360
          drag: { x: 0, y: 0 }, back: null,  // hand rotation and the ease back
        });
      }
      fit();
      envReady.then(() => { introStart = performance.now() / 1000; });
    });

    // ---- hover: one smooth 360 per star; drag: turn it by hand, let go and it eases back ----
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(9, 9);
    let hovered = null;
    let dragging = null;   // { star, x, y, moved }

    function starAt(x, y) {
      const r = canvas.getBoundingClientRect();
      pointer.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(stars.map((s) => s.mesh), false)[0];
      return hit ? stars.find((s) => s.mesh === hit.object) : null;
    }

    const now = () => performance.now() / 1000;
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    // overshoots its spot a little and settles back: the bounce on the entrance
    const easeOutBack = (t, s = 2.4) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

    function spin(star) {
      if (!star || star.spin) return;   // let a running spin finish
      star.spin = { start: now() };
    }

    canvas.addEventListener("pointerdown", (e) => {
      const s = starAt(e.clientX, e.clientY);
      if (!s) return;
      s.back = null;
      dragging = { star: s, x: e.clientX, y: e.clientY, moved: 0 };
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = "grabbing";
    });

    canvas.addEventListener("pointermove", (e) => {
      if (dragging) {
        const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
        dragging.x = e.clientX; dragging.y = e.clientY;
        dragging.moved += Math.abs(dx) + Math.abs(dy);
        dragging.star.drag.y += dx * DRAG_SPEED;
        dragging.star.drag.x += dy * DRAG_SPEED;
        return;
      }
      const s = starAt(e.clientX, e.clientY);
      if (s && s !== hovered && e.pointerType === "mouse") spin(s);
      hovered = s;
      canvas.style.cursor = s ? "grab" : "";
    });

    function release(e) {
      if (!dragging) return;
      const s = dragging.star;
      if (dragging.moved < 4) spin(s);   // a tap (touch screens) also gives the 360
      // ease back the shortest way round
      s.drag.x = Math.atan2(Math.sin(s.drag.x), Math.cos(s.drag.x));
      s.drag.y = Math.atan2(Math.sin(s.drag.y), Math.cos(s.drag.y));
      s.back = { start: now(), x: s.drag.x, y: s.drag.y };
      dragging = null;
      hovered = starAt(e.clientX, e.clientY);
      canvas.style.cursor = hovered ? "grab" : "";
    }
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("pointerleave", () => { if (!dragging) { hovered = null; canvas.style.cursor = ""; } });

    // ---- layout ----
    function fit() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // keep the whole group (about 2.5 x 3 units) in view in portrait and landscape
      const fitH = 3.4 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
      camera.position.z = Math.max(fitH, fitH * (2.8 / 3.4) / camera.aspect);
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", fit);
    fit();

    // ---- animation loop ----
    renderer.setAnimationLoop((ms) => {
      const t = ms / 1000;
      const k = reduceMotion ? 0 : 1;

      // let the studio lights drift slowly so the reflections keep moving
      scene.environmentRotation.set(
        k * (0.14 * Math.sin(t * 0.31) + 0.05 * Math.sin(t * 0.73)),
        k * (0.30 * Math.sin(t * 0.21) + 0.10 * Math.sin(t * 0.53)),
        k * 0.12 * Math.sin(t * 0.27));

      for (const s of stars) {
        const f = s.float;
        const w = (2 * Math.PI) / f.period;
        // entrance: rise from below and fade in, one star after the other
        let rise = 0;
        if (introStart === null) {
          s.mesh.material.opacity = 0;
        } else if (s.mesh.material.transparent) {
          const p = Math.min(Math.max((t - introStart - f.delay) / INTRO_SECONDS, 0), 1);
          const e = easeOutBack(p);
          rise = -INTRO_DROP * (1 - e) * k;
          s.mesh.material.opacity = Math.min(1, p * 2.5);
          if (p >= 1) s.mesh.material.transparent = false;   // back to a plain solid once it has landed
        }
        s.pivot.position.y = s.base.y + rise + k * f.lift * Math.sin(w * t + f.phase);
        s.pivot.position.x = s.base.x + k * f.lift * 0.4 * Math.sin(0.5 * w * t + f.phase * 1.3);

        if (s.spin) {
          const p = Math.min((t - s.spin.start) / SPIN_SECONDS, 1);
          s.spinAngle = 2 * Math.PI * easeInOut(p);
          if (p >= 1) { s.spinAngle = 0; s.spin = null; }
        }
        if (s.back) {
          const p = Math.min((t - s.back.start) / RETURN_SECONDS, 1);
          const left = 1 - easeOut(p);
          s.drag.x = s.back.x * left; s.drag.y = s.back.y * left;
          if (p >= 1) s.back = null;
        }

        s.pivot.rotation.x = k * f.tilt * 0.6 * Math.sin(0.6 * w * t + f.phase * 0.7) + s.drag.x;
        s.pivot.rotation.y = s.spinAngle + s.drag.y;
        s.pivot.rotation.z = k * f.tilt * Math.sin(0.7 * w * t + f.phase);
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
